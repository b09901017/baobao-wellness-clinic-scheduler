name: 全量 E2E

# **這一支刻意跟 `deploy.yml` 分開，而且刻意不擋 staging。**
#
# `deploy.yml` 每支 PR 都跑單元測試、Rules 與三支 E2E（煙霧／混沌／離線）——
# 那三支擋掉的是最貴的災難，而且快。全套 193 支要 21 分鐘（`workers: 1`，
# 每一支都會把 Firestore 清空），把它塞進那條路等於每次推 develop 都要等
# 21 分鐘才上 staging。
#
# 所以全量只在兩個時機跑：
#
#   1. **PR 進 `main`** —— 那一邊有真客戶資料，值得等
#   2. **她自己按** —— 本機全跑要佔住電腦 21 分鐘而且期間不能改 `public/`
#      （service worker 的殼會被換掉）。按一下丟給這裡，去做別的事
#
# 推 develop（上 staging）刻意不跑：那裡是假資料，而且 `deploy.yml` 那三支
# 已經擋著整頁白屏那一類。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    # **CI 上開三台機器，一台跑三分之一。**
    #
    # `workers: 1` 在本機還解不掉（見 `playwright.config.js` 的檔頭：真正的瓶頸
    # 是那一顆 Firestore 模擬器與每個測試都重載一次 Firebase SDK），但 CI 上
    # 不需要解那個問題 —— 三個 job 是三台各自獨立的機器，各有自己的模擬器，
    # 所以 `workers` 一個字都不用動。
    #
    # 切法是 Playwright 內建的 `--shard=i/N`，**照測試數量切**（`fullyParallel: false`
    # 之下實際是照檔案切）。193 支切出來是 70／60／63，**加起來要等於 193**——
    # 某一份寫錯參數而跑了 0 支的話三個 job 照樣全綠，**這是這件事唯一會靜默
    # 出錯的地方**。要驗的話本機就問得到，不用等 CI：
    #
    #     for i in 1 2 3; do npx playwright test --project=phone --shard=$i/3 --list | tail -1; done
    #
    # 三份不會一樣長（`07-chaos` 一支就佔全套 13%），先接受不平均。
    strategy:
      # **不要漏。** 沒有它，第一份紅掉時另外兩份會被取消，
      # 而你會誤以為問題只有一個。
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: 全量 E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 本機全量 21.5 分鐘，三份之後一份估 8~10 分鐘；CI 這台機器核心少，留兩倍餘裕。
    # 沒有這一行的話卡住會吃滿 GitHub 預設的 6 小時。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Firestore 模擬器是 Java 寫的
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 全量端對端（第 ${{ matrix.shard }} 份，共 3 份）
        env:
          CI: '1'
        # 用 `npm ci` 裝好的那一支 firebase-tools（devDependency 的 ^15），
        # 不要另外 npx 拉一個 —— 模擬器這條路跟部署那條無關（它不碰
        # serviceusage，所以不受 `deploy.yml` 那個版本釘子影響），
        # 而且本機跟 CI 跑的是同一個版本才對得起來。
        #
        # `emulators:exec` 自己起、自己關，不需要背景程序。
        # projectId 是 `demo-` 開頭 → 完全離線，不需要任何憑證。
        run: |
          npx firebase emulators:exec \
            --project demo-scheduler \
            --only auth,firestore,hosting \
            "npx playwright test --project=phone --shard=${{ matrix.shard }}/3"

      # **失敗才留。** trace 裡有每一步的畫面、DOM、console 與網路，
      # 下載回來 `npx playwright show-trace` 就能一步一步倒帶。
      #
      # 名字要帶 shard 號 —— 三個 job 同名會撞（upload-artifact@v4 直接報錯）。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 全量-e2e-證據-${{ matrix.shard }}
          path: .artifacts/
          retention-days: 7
