name: 測試與部署

# push 到 main 就上線。維護者多用手機開發，不能依賴本機跑 firebase deploy。
#
# PR 也跑，但只跑測試那一段 —— 測試結果要在合併之前看得到，
# 不是合併之後才發現紅的。部署由下面的 if 擋掉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 不是密鑰，與 .firebaserc 同一個值
  FIREBASE_PROJECT_ID: wellness-clinic-scheduler

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 沒有相依套件，不需要 npm install
      - run: npm test

  deploy:
    needs: test
    # PR 只驗證，不上線。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只需要一個 repository secret：FIREBASE_SERVICE_ACCOUNT（服務帳號 JSON 全文）。
      # 服務帳號金鑰絕對不能 commit，只能放 secrets。
      #
      # 專案 ID 不是密鑰（.firebaserc 和 firebase-config.js 裡本來就有），
      # 放進 secrets 只會讓 Actions 日誌把它遮成 ***，出事時反而看不懂。
      - name: 部署 Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

      # 上面那個 action 只部署 Hosting。Rules 是真正的安全防線，
      # 必須跟著程式一起上線，不能靠人記得手動部署。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 部署 Firestore Rules 與索引
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
