name: Android（隨手記小工具）

# 另一支 workflow，**不放進 deploy.yml**（ADR-0180）：
#
# - deploy.yml 的 concurrency 掛在 workflow 那一層 —— 放進去的話每一次部署都要等 Gradle
# - 只在 Android 那一份、或它照抄的網頁規則與情境檔有變時跑；**不設成必要檢查**（網頁的 PR 不會因為它多等、多一條會紅的）
#
# 跑的：core 的單元測試（讀 tests/fixtures/notes-parity.json，跟網頁那一側對同一份答案）＋兩個版本的 debug 建置。
# 網頁那一側的 tests/notes-parity.test.js 在 deploy.yml 的 `npm test` 裡照跑（每一支 PR 都跑）。
# release 簽章、派送（Firebase App Distribution）是 issue 09 的事。
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/fixtures/notes-parity.json'
      - 'public/js/domain/notes.js'
      - '.github/workflows/android.yml'
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'tests/fixtures/notes-parity.json'
      - 'public/js/domain/notes.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: core 的單元測試（跟網頁對同一份情境檔）＋兩個版本的 debug 建置
        run: ./gradlew :core:test :app:assembleStagingDebug :app:assembleProdDebug --console=plain
