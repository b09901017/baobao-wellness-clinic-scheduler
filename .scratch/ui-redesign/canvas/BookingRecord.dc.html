<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FAF7F2;
      color: #241F1A;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #2F5D4C; text-decoration: none; }
    a:hover { color: #24493B; }
    h1, h2, h3 { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; margin: 0; }
    svg { display: block; }
    .ser { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1240px; background: #FAF7F2; display: flex; flex-direction: column; position: relative;">

  <div style="background: #FFFFFF; border-bottom: 1px solid #E3DCD1; padding: 18px 20px 14px;">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; margin-left: -6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5L8.5 12l6.5 6.5"/></svg>
      <span style="font-size: 15px; font-weight: 700; color: #6B6157;">壓表</span>
      <span style="flex-grow: 1;"></span>
      <span class="num" style="display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 999px; background: #E4EDE8; color: #2F5D4C; font-size: 13px; font-weight: 700;">已記 2 筆</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 4px; flex-wrap: wrap;">
      <h1 class="ser" style="font-size: 26px; font-weight: 700;">王小姐</h1>
      <span style="font-size: 13px; color: #A4703C; font-weight: 700; letter-spacing: 0.1em;">★★★</span>
    </div>

    <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;">
      <span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: #F7E4E0; color: #A63A2A; font-size: 12px; font-weight: 700;">不能 · 9月每週一</span>
      <span class="num" style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; background: #F7E4E0; color: #A63A2A; font-size: 12px; font-weight: 700;">9/17・9/18・9/22–24</span>
    </div>
    <div style="margin-top: 7px; font-size: 13px; color: #6B6157; line-height: 1.55;">「9月禮拜一不行，9/17、9/18、9/22–24 出國不行」<span style="color: #9A9086;">・8/28 收集</span></div>
  </div>

  <div style="padding: 16px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
      <h2 class="ser" style="font-size: 19px; font-weight: 600;">挑日子</h2>
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
        <span class="num" style="font-size: 16px; font-weight: 700;">9月</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3DCD1; border-radius: 20px; padding: 14px 12px;">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 6px;">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <div style="text-align: center; font-size: 12px; font-weight: 700; color: #9A9086;">{{w}}</div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <div onClick="{{c.pick}}" style="height: 46px; border-radius: 13px; background: {{c.bg}}; border: 1.5px solid {{c.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
            <span class="num" style="font-size: 15px; font-weight: {{c.weight}}; color: {{c.fg}}; text-decoration: {{c.deco}};">{{c.d}}</span>
            <span style="width: 5px; height: 5px; border-radius: 999px; background: {{c.dot}};"></span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding-top: 11px; border-top: 1px solid #EFE9E0;">
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 12px; height: 12px; border-radius: 5px; background: {{l.bg}}; border: 1.5px solid {{l.line}};"></span>
            <span style="font-size: 12px; color: #6B6157;">{{l.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 0;">
    <div style="background: #FFFFFF; border: 1px solid #2F5D4C; border-radius: 20px; padding: 16px; box-shadow: 0 4px 14px rgba(47, 93, 76, 0.10);">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
        <h3 class="ser" style="font-size: 20px; font-weight: 600;">{{picked.label}}</h3>
        <span style="font-size: 13px; color: #9A9086;">{{picked.note}}</span>
      </div>

      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <div style="margin-bottom: 14px;">
          <div style="font-size: 13px; font-weight: 700; color: #6B6157; margin-bottom: 7px;">{{f.label}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{f.options}}" as="o" hint-placeholder-count="4">
              <div onClick="{{o.pick}}" style="display: inline-flex; align-items: center; height: 42px; padding: 0 15px; border-radius: 999px; font-size: 15px; font-weight: {{o.weight}}; background: {{o.bg}}; border: 1px solid {{o.line}}; color: {{o.fg}}; text-decoration: {{o.deco}};">{{o.label}}</div>
            </sc-for>
          </div>
          <sc-if value="{{f.hint}}" hint-placeholder-val="{{true}}">
            <div style="margin-top: 6px; font-size: 12px; color: #A63A2A; font-weight: 700;">{{f.hint}}</div>
          </sc-if>
        </div>
      </sc-for>

      <div style="margin-bottom: 14px;">
        <div style="font-size: 13px; font-weight: 700; color: #6B6157; margin-bottom: 7px;">備註</div>
        <div style="min-height: 46px; border-radius: 13px; border: 1px solid #E3DCD1; background: #FCFAF7; padding: 11px 13px; font-size: 16px; color: #B5ABA0;">她說下午比較好</div>
      </div>

      <div style="height: 50px; border-radius: 15px; background: #2F5D4C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">加這一筆</div>
    </div>
  </div>

  <div style="padding: 18px 20px 0;">
    <h2 class="ser" style="font-size: 19px; font-weight: 600; margin-bottom: 10px;">這次壓好的</h2>
    <div style="background: #FFFFFF; border: 1px solid #E3DCD1; border-radius: 20px; overflow: hidden;">
      <sc-for list="{{recorded}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-top: 1px solid {{r.sep}};">
          <span style="width: 4px; align-self: stretch; border-radius: 999px; background: #2F5D4C; flex-shrink: 0;"></span>
          <div style="flex-grow: 1; min-width: 0;">
            <div class="num" style="font-size: 16px; font-weight: 700;">{{r.when}}</div>
            <div style="font-size: 14px; color: #6B6157; margin-top: 2px;">{{r.what}}</div>
          </div>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C4BBAE" stroke-width="2" stroke-linecap="round" style="margin-top: 3px;"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; gap: 10px;">
    <div style="flex-grow: 1; height: 52px; border-radius: 16px; background: #241F1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">這位壓完了，下一位</div>
  </div>
  <p style="margin: 10px 20px 0; font-size: 13px; color: #9A9086; line-height: 1.6;">按下去之後，王小姐會出現在待辦的「跟客人確認時間」。</p>

  <div style="height: 100px;"></div>

    <div style="margin-top: auto; display: flex; align-items: stretch; background: #FFFFFF; border-top: 1px solid #E3DCD1; padding: 4px 4px 10px;">
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.2l2.8 2.8L16.4 9.4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">待辦</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2F5D4C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9.5 4h5v2.6h-5z"/><path d="M9 12h6M9 16h4"/></svg>
        <span style="font-size: 11px; font-weight: 700; color: #2F5D4C;">壓表</span>
        <span style="width:5px;height:5px;border-radius:999px;background:#2F5D4C;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">日曆</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.7-5.8 6-5.8s6 2.6 6 5.8"/><path d="M16.4 5.4a3.2 3.2 0 010 5.6M20.5 20c0-2.3-.9-4-2.2-5.1"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">客戶</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">設定</span>
        <span style="width:5px;height:5px;"></span>
      </div>
    </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 9, course: '復能', time: '14:00', therapist: '騰崴', equip: 'INDIBA' };
  }

  renderVals() {
    const st = this.state || {};
    const day = st.day || 9;

    // 2026 年 9 月 1 日是週二，月曆從週日排起
    const blocked = [7, 14, 21, 28, 17, 18, 22, 23, 24];
    const recordedDays = [3, 10];

    const cells = [];
    for (let i = 0; i < 35; i += 1) {
      const d = i - 1;
      if (d < 1 || d > 30) {
        cells.push({ d: '', bg: 'transparent', line: 'transparent', fg: '#FFFFFF', dot: 'transparent', deco: 'none', weight: '400', pick: () => {} });
        continue;
      }
      const isBlocked = blocked.indexOf(d) >= 0;
      const isRecorded = recordedDays.indexOf(d) >= 0;
      const isPicked = d === day;
      cells.push({
        d: String(d),
        bg: isPicked ? '#FFFFFF' : isRecorded ? '#E4EDE8' : isBlocked ? '#F3EFE8' : '#FFFFFF',
        line: isPicked ? '#2F5D4C' : isRecorded ? '#CADCD3' : isBlocked ? '#F3EFE8' : '#EFE9E0',
        fg: isBlocked ? '#BDB3A6' : isRecorded ? '#2F5D4C' : '#241F1A',
        deco: isBlocked ? 'line-through' : 'none',
        weight: isPicked || isRecorded ? '700' : '500',
        dot: isRecorded ? '#2F5D4C' : 'transparent',
        pick: () => { if (!isBlocked) this.setState({ day: d }); },
      });
    }

    const chipSet = (key, options) => options.map((o) => {
      const on = (st[key] || '') === o.label;
      return {
        label: o.label,
        bg: o.off ? '#F3EFE8' : on ? '#2F5D4C' : '#FFFFFF',
        line: o.off ? '#F3EFE8' : on ? '#2F5D4C' : '#E3DCD1',
        fg: o.off ? '#BDB3A6' : on ? '#FFFFFF' : '#241F1A',
        weight: on ? '700' : '500',
        deco: o.off ? 'line-through' : 'none',
        pick: () => { if (!o.off) this.setState({ [key]: o.label }); },
      };
    });

    return {
      weekdays: ['日', '一', '二', '三', '四', '五', '六'],
      cells,
      legend: [
        { label: '可以排', bg: '#FFFFFF', line: '#EFE9E0' },
        { label: '已經記了', bg: '#E4EDE8', line: '#CADCD3' },
        { label: '她說不行', bg: '#F3EFE8', line: '#F3EFE8' },
      ],
      picked: { label: '9月' + day + '日（三）', note: '這天還沒排東西' },
      fields: [
        { label: '做什麼', hint: '', options: chipSet('course', [
          { label: '復能' }, { label: '靜脈' }, { label: 'EECP' },
          { label: '營養點滴' }, { label: '復健科醫師門診' }, { label: '身體組成分析' },
        ]) },
        { label: '幾點', hint: '', options: chipSet('time', [
          { label: '10:30' }, { label: '11:00' }, { label: '13:30' },
          { label: '14:00' }, { label: '15:00' }, { label: '16:00' },
        ]) },
        { label: '器材　復能三選一', hint: '', options: chipSet('equip', [
          { label: 'INDIBA' }, { label: '超磁場' }, { label: '高能量雷射' },
        ]) },
        { label: '治療師', hint: '', options: chipSet('therapist', [
          { label: '騰崴' }, { label: '芝寧' }, { label: 'LuLu' },
        ]) },
      ],
      recorded: [
        { when: '9/3（三）14:00–15:00', what: '復能・INDIBA・騰崴', sep: 'transparent' },
        { when: '9/10（四）15:15–16:15', what: '靜脈・治3', sep: '#EFE9E0' },
      ],
    };
  }
}
</script>
</body>
</html>
