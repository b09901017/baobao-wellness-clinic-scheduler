<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FAF7F2;
      color: #241F1A;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #2F5D4C; text-decoration: none; }
    a:hover { color: #24493B; }
    h1, h2, h3 { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; margin: 0; }
    svg { display: block; }
    .ser { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1120px; background: #FAF7F2; display: flex; flex-direction: column; position: relative;">

  <div style="padding: 20px 20px 12px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div>
        <h1 class="ser" style="font-size: 27px; font-weight: 700; line-height: 1.3;">壓表</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #6B6157;">一個人壓完再換下一個</p>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
        <span class="num" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3DCD1; font-size: 15px; font-weight: 700;">9月</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
      </div>
    </div>

    <div style="margin-top: 14px; background: #FFFFFF; border: 1px solid #E3DCD1; border-radius: 16px; padding: 13px 15px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 700; color: #6B6157;">這個月已壓</span>
        <span class="num ser" style="font-size: 20px; font-weight: 700;">5 <span style="font-size: 15px; color: #9A9086; font-weight: 500;">/ 23 位</span></span>
      </div>
      <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #EFE9E0; margin-top: 8px;">
        <span style="width: 22%; background: #2F5D4C;"></span>
      </div>
    </div>
  </div>

  <div style="padding: 0 20px 4px;">
    <div style="display: flex; flex-wrap: wrap; gap: 7px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <div onClick="{{f.pick}}" style="display: inline-flex; align-items: center; height: 40px; padding: 0 15px; border-radius: 999px; font-size: 14px; font-weight: 700; background: {{f.bg}}; border: 1px solid {{f.line}}; color: {{f.fg}};">{{f.label}}</div>
      </sc-for>
    </div>
    <p style="margin: 10px 0 0; font-size: 13px; color: #9A9086; line-height: 1.6;">順序是算出來的預設值 —— 限制多的、快到期的排前面。想先弄誰就點誰。</p>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E3DCD1; border-radius: 22px; padding: 16px; box-shadow: 0 2px 10px rgba(36, 31, 26, 0.05);">

        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <div style="flex-grow: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span class="ser" style="font-size: 22px; font-weight: 600;">{{c.name}}</span>
              <span style="font-size: 13px; color: #A4703C; font-weight: 700; letter-spacing: 0.1em;">{{c.stars}}</span>
              <sc-if value="{{c.flag}}" hint-placeholder-val="{{true}}">
                <span style="display: inline-flex; align-items: center; height: 23px; padding: 0 9px; border-radius: 7px; background: #F7E4E0; color: #A63A2A; font-size: 12px; font-weight: 700;">{{c.flag}}</span>
              </sc-if>
            </div>
            <div style="font-size: 13px; color: #9A9086; margin-top: 2px;">{{c.reason}}</div>
          </div>
          <span style="display: inline-flex; align-items: center; height: 27px; padding: 0 11px; border-radius: 8px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 12px; font-weight: 700; flex-shrink: 0;">{{c.status}}</span>
        </div>

        <div style="margin-top: 13px; border-radius: 16px; background: {{c.banBg}}; border: 1px solid {{c.banLine}}; padding: 13px 14px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px;">
            <span style="font-size: 13px; font-weight: 700; color: {{c.banFg}}; letter-spacing: 0.04em;">不能的時間</span>
            <span style="font-size: 12px; color: #9A9086;">{{c.collected}}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{c.bans}}" as="b" hint-placeholder-count="4">
              <span class="num" style="display: inline-flex; align-items: center; height: 30px; padding: 0 11px; border-radius: 999px; background: #FFFFFF; border: 1px solid {{c.banLine}}; color: {{c.banFg}}; font-size: 13px; font-weight: 700;">{{b}}</span>
            </sc-for>
          </div>
          <div style="margin-top: 10px; font-size: 14px; line-height: 1.6; color: #4A4239;">{{c.raw}}</div>
        </div>

        <div style="margin-top: 13px; display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{c.pools}}" as="p" hint-placeholder-count="4">
            <span class="num" style="display: inline-flex; align-items: baseline; gap: 5px; height: 32px; padding: 0 12px; border-radius: 10px; background: #F3EFE8; font-size: 13px; font-weight: 500; color: #4A4239;">{{p.label}}<b style="font-size: 15px; font-weight: 700; color: {{p.fg}};">{{p.left}}</b></span>
          </sc-for>
        </div>

        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #EFE9E0; display: flex; align-items: center; gap: 10px;">
          <span class="num" style="font-size: 13px; color: #6B6157;">{{c.visits}}</span>
          <span style="flex-grow: 1;"></span>
          <div style="display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 18px; border-radius: 14px; background: #2F5D4C; color: #FFFFFF; font-size: 15px; font-weight: 700;">開始壓這位</div>
        </div>

        <sc-if value="{{c.note}}" hint-placeholder-val="{{true}}">
          <div style="margin-top: 11px; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #FCFAF7; border: 1px dashed #DFD6C8;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A4703C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 2px; flex-shrink: 0;"><path d="M12 3.5l8.5 15.5h-17z"/><path d="M12 9.5v4M12 16.5h.01"/></svg>
            <span style="font-size: 13px; line-height: 1.55; color: #6B6157;">{{c.note}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="height: 110px;"></div>

  <div style="position: absolute; right: 18px; bottom: 84px;">
    <div style="width: 60px; height: 60px; border-radius: 999px; background: #2F5D4C; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(47, 93, 76, 0.34);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

    <div style="margin-top: auto; display: flex; align-items: stretch; background: #FFFFFF; border-top: 1px solid #E3DCD1; padding: 4px 4px 10px;">
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.2l2.8 2.8L16.4 9.4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">待辦</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2F5D4C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9.5 4h5v2.6h-5z"/><path d="M9 12h6M9 16h4"/></svg>
        <span style="font-size: 11px; font-weight: 700; color: #2F5D4C;">壓表</span>
        <span style="width:5px;height:5px;border-radius:999px;background:#2F5D4C;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">日曆</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.7-5.8 6-5.8s6 2.6 6 5.8"/><path d="M16.4 5.4a3.2 3.2 0 010 5.6M20.5 20c0-2.3-.9-4-2.2-5.1"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">客戶</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">設定</span>
        <span style="width:5px;height:5px;"></span>
      </div>
    </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todo' };
  }

  renderVals() {
    const st = this.state || {};
    const cur = st.filter || 'todo';

    const filters = [
      { id: 'all', label: '全部 23' },
      { id: 'todo', label: '還沒壓 18' },
      { id: 'noask', label: '沒問過時間 4' },
      { id: 'expiring', label: '快到期 3' },
    ].map((f) => ({
      ...f,
      bg: f.id === cur ? '#2F5D4C' : '#FFFFFF',
      line: f.id === cur ? '#2F5D4C' : '#E3DCD1',
      fg: f.id === cur ? '#FFFFFF' : '#4A4239',
      pick: () => this.setState({ filter: f.id }),
    }));

    const pool = (label, left, low) => ({ label, left, fg: low ? '#A63A2A' : '#2F5D4C' });

    return {
      filters,
      cards: [
        {
          name: '王小姐', stars: '★★★', flag: '',
          reason: '可用 6 天・最少　方案 11/30 到期',
          status: '還沒壓', stBg: '#F8EED8', stFg: '#8A6410',
          banBg: '#FDF6F4', banLine: '#EFDCD7', banFg: '#A63A2A',
          collected: '8/28 收集',
          bans: ['9月每週一', '9/17', '9/18', '9/22–24'],
          raw: '「9月禮拜一不行，9/17、9/18、9/22–24 出國不行」',
          pools: [pool('復能', '12'), pool('靜脈', '8'), pool('復健科', '2', true), pool('營養點滴', '5')],
          visits: '8月來 3 次・7月 4 次・距上次 21 天',
          note: '',
        },
        {
          name: '陳先生', stars: '★★', flag: '體內金屬',
          reason: '可用 11 天　距上次 46 天',
          status: '壓了 2 筆', stBg: '#E4EDE8', stFg: '#2F5D4C',
          banBg: '#FDF6F4', banLine: '#EFDCD7', banFg: '#A63A2A',
          collected: '8/30 收集',
          bans: ['9/10–9/14', '每週五下午'],
          raw: '「9/10 到 9/14 回南部，禮拜五下午要接小孩」',
          pools: [pool('復能', '18'), pool('靜脈', '1', true), pool('EECP', '6'), pool('健檢', '1')],
          visits: '8月來 1 次・7月 2 次・距上次 46 天',
          note: '超磁場與高能量雷射鎖死，復能只能用 INDIBA。重大疾病治療中。',
        },
        {
          name: '黃太太', stars: '★', flag: '',
          reason: '還沒問這輪的時間',
          status: '還沒壓', stBg: '#F8EED8', stFg: '#8A6410',
          banBg: '#FCFAF7', banLine: '#E7DFD3', banFg: '#8A6410',
          collected: '上次 7/12・過期',
          bans: ['還沒問'],
          raw: '不知道她 9 月哪幾天可以 —— 先傳訊息問。',
          pools: [pool('復能', '20'), pool('靜脈', '12'), pool('身體組成', '4')],
          visits: '8月來 0 次・7月 1 次・距上次 38 天',
          note: '',
        },
      ],
    };
  }
}
</script>
</body>
</html>
