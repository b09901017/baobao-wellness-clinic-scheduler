<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FAF7F2;
      color: #241F1A;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #2F5D4C; text-decoration: none; }
    a:hover { color: #24493B; }
    h1, h2, h3 { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; margin: 0; }
    svg { display: block; }
    .ser { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1020px; background: #FAF7F2; display: flex; flex-direction: column; position: relative;">

  <div style="padding: 20px 20px 12px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <h1 class="ser" style="font-size: 27px; font-weight: 700;">客戶</h1>
      <span class="num" style="font-size: 14px; color: #9A9086; padding-bottom: 5px;">23 位</span>
    </div>
    <div style="margin-top: 12px; height: 48px; border-radius: 15px; background: #FFFFFF; border: 1px solid #E3DCD1; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B5ABA0" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
      <span style="font-size: 16px; color: #B5ABA0;">找人</span>
    </div>
  </div>

  <div style="padding: 0 20px;">
    <div style="display: flex; flex-wrap: wrap; gap: 7px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <div onClick="{{f.pick}}" style="display: inline-flex; align-items: center; height: 40px; padding: 0 15px; border-radius: 999px; font-size: 14px; font-weight: 700; background: {{f.bg}}; border: 1px solid {{f.line}}; color: {{f.fg}};">{{f.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E3DCD1; border-radius: 22px; padding: 16px; box-shadow: 0 2px 10px rgba(36, 31, 26, 0.05);">
        <div style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 13px;">
          <div style="flex-grow: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span class="ser" style="font-size: 21px; font-weight: 600;">{{p.name}}</span>
              <sc-if value="{{p.flag}}" hint-placeholder-val="{{true}}">
                <span style="display: inline-flex; align-items: center; height: 23px; padding: 0 9px; border-radius: 7px; background: #F7E4E0; color: #A63A2A; font-size: 12px; font-weight: 700;">{{p.flag}}</span>
              </sc-if>
            </div>
            <div class="num" style="font-size: 13px; color: #9A9086; margin-top: 2px;">{{p.meta}}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4BBAE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 5px;"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg>
        </div>

        <div style="display: flex; flex-direction: column; gap: 11px;">
          <sc-for list="{{p.pools}}" as="q" hint-placeholder-count="3">
            <div>
              <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px;">
                <span style="font-size: 15px; font-weight: 700;">{{q.label}}</span>
                <span class="num" style="font-size: 13px; color: #9A9086;">{{q.done}} 上過・{{q.booked}} 已排・<b style="color: {{q.leftFg}}; font-size: 15px;">{{q.left}}</b> 剩</span>
              </div>
              <div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #EFE9E0;">
                <span style="width: {{q.doneW}}; background: #2F5D4C;"></span>
                <span style="width: {{q.bookedW}}; background: #A4703C;"></span>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="margin-top: 13px; padding-top: 12px; border-top: 1px solid #EFE9E0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{p.tags}}" as="t" hint-placeholder-count="2">
            <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 700;">{{t.label}}</span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 110px;"></div>

  <div style="position: absolute; right: 18px; bottom: 84px; width: 60px; height: 60px; border-radius: 999px; background: #2F5D4C; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(47, 93, 76, 0.34);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

    <div style="margin-top: auto; display: flex; align-items: stretch; background: #FFFFFF; border-top: 1px solid #E3DCD1; padding: 4px 4px 10px;">
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.2l2.8 2.8L16.4 9.4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">待辦</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9.5 4h5v2.6h-5z"/><path d="M9 12h6M9 16h4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">壓表</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">日曆</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2F5D4C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.7-5.8 6-5.8s6 2.6 6 5.8"/><path d="M16.4 5.4a3.2 3.2 0 010 5.6M20.5 20c0-2.3-.9-4-2.2-5.1"/></svg>
        <span style="font-size: 11px; font-weight: 700; color: #2F5D4C;">客戶</span>
        <span style="width:5px;height:5px;border-radius:999px;background:#2F5D4C;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">設定</span>
        <span style="width:5px;height:5px;"></span>
      </div>
    </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1020}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }

  renderVals() {
    const st = this.state || {};
    const cur = st.filter || 'all';

    const filters = [
      { id: 'all', label: '全部' },
      { id: 'low', label: '次數快用完 5' },
      { id: 'stale', label: '可用性過期 4' },
      { id: 'exp', label: '會籍快到期 3' },
    ].map((f) => ({
      ...f,
      bg: f.id === cur ? '#2F5D4C' : '#FFFFFF',
      line: f.id === cur ? '#2F5D4C' : '#E3DCD1',
      fg: f.id === cur ? '#FFFFFF' : '#4A4239',
      pick: () => this.setState({ filter: f.id }),
    }));

    const pool = (label, done, booked, total) => {
      const left = total - done - booked;
      return {
        label, done, booked, left, total,
        doneW: Math.round((done / total) * 100) + '%',
        bookedW: Math.round((booked / total) * 100) + '%',
        leftFg: left <= 2 ? '#A63A2A' : '#2F5D4C',
      };
    };

    const tag = (label, tone) => ({
      label,
      bg: tone === 'bad' ? '#F7E4E0' : tone === 'warn' ? '#F8EED8' : '#F3EFE8',
      fg: tone === 'bad' ? '#A63A2A' : tone === 'warn' ? '#8A6410' : '#6B6157',
    });

    return {
      filters,
      people: [
        {
          name: '王小姐', flag: '', meta: '筋骨強身・會籍到 2026/11/30・上次 7/29',
          pools: [pool('復能', 6, 2, 20), pool('靜脈', 4, 0, 12), pool('復健科醫師門診', 4, 0, 6)],
          tags: [tag('下次 9/3'), tag('復健科剩 2', 'warn')],
        },
        {
          name: '陳先生', flag: '體內金屬', meta: '8萬方案 ×2・會籍到 2027/03/14・上次 7/04',
          pools: [pool('復能', 20, 2, 40), pool('靜脈', 23, 0, 24), pool('EECP', 2, 0, 8)],
          tags: [tag('靜脈剩 1', 'bad'), tag('距上次 46 天', 'warn'), tag('重大疾病治療中', 'bad')],
        },
        {
          name: '黃太太', flag: '', meta: '筋骨強身・會籍到 2026/09/30・上次 7/12',
          pools: [pool('復能', 3, 0, 12), pool('靜脈', 2, 0, 20)],
          tags: [tag('會籍剩 42 天・還有 27 次', 'bad'), tag('可用性過期', 'warn')],
        },
      ],
    };
  }
}
</script>
</body>
</html>
