<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FAF7F2;
      color: #241F1A;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #2F5D4C; text-decoration: none; }
    a:hover { color: #24493B; }
    h1, h2, h3 { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; margin: 0; }
    svg { display: block; }
    .ser { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 390px; min-height: 940px; background: #FAF7F2; display: flex; flex-direction: column; position: relative;">

  <div style="background: #FFFFFF; border-bottom: 1px solid #E3DCD1;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 16px 18px 10px;">
      <h1 class="ser num" style="font-size: 24px; font-weight: 700;">2026年8月</h1>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6157" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
      <span style="flex-grow: 1;"></span>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #F3EFE8; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A4239" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #F3EFE8; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A4239" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; padding: 0 18px 10px; overflow: hidden;">
      <sc-for list="{{calendars}}" as="c" hint-placeholder-count="3">
        <div onClick="{{c.toggle}}" style="display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 8px; border-radius: 999px; background: {{c.bg}}; border: 1px solid {{c.line}}; flex-shrink: 0;">
          <span style="width: 18px; height: 18px; border-radius: 6px; background: {{c.box}}; display: flex; align-items: center; justify-content: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{c.tick}}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          </span>
          <span style="font-size: 13px; font-weight: 700; color: {{c.fg}};">{{c.label}}</span>
        </div>
      </sc-for>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 9.5l6 6 6-6"/></svg>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 8px 8px;">
      <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
        <div style="text-align: center; font-size: 12px; font-weight: 700; color: {{w.fg}};">{{w.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 2px 8px 0;">
    <sc-for list="{{weeks}}" as="wk" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 2px; border-bottom: 1px solid #EFE9E0; padding-bottom: 5px; margin-bottom: 3px; min-height: 92px; align-content: start;">
        <sc-for list="{{wk.days}}" as="d" hint-placeholder-count="7">
          <div style="grid-column: {{d.col}}; grid-row: 1; display: flex; justify-content: center; padding: 4px 0 3px;">
            <span class="num" style="min-width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: {{d.weight}}; color: {{d.fg}}; background: {{d.bg}};">{{d.n}}</span>
          </div>
        </sc-for>
        <sc-for list="{{wk.bars}}" as="b" hint-placeholder-count="3">
          <div style="grid-column: {{b.col}} / span {{b.span}}; grid-row: {{b.row}}; min-height: 18px; border-radius: 5px; background: {{b.bg}}; padding: 0 5px; display: flex; align-items: center; overflow: hidden; margin-bottom: 2px;">
            <span style="font-size: 11px; font-weight: 700; color: {{b.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.label}}</span>
          </div>
        </sc-for>
        <sc-for list="{{wk.more}}" as="m" hint-placeholder-count="1">
          <div style="grid-column: {{m.col}}; grid-row: {{m.row}}; display: flex; justify-content: center;">
            <span class="num" style="font-size: 10px; font-weight: 700; color: #9A9086;">{{m.label}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="padding: 10px 20px 0; display: flex; align-items: center; gap: 8px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A4703C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/></svg>
    <span style="font-size: 12px; color: #6B6157; line-height: 1.5;">這裡只有你自己排的。同事在 Abovee 壓的看不到 —— 空格子不代表那個時段真的空著。</span>
  </div>

  <div style="height: 110px;"></div>

  <sc-if value="{{fabOpen}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; right: 18px; bottom: 156px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
      <sc-for list="{{fabItems}}" as="f" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 13px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3DCD1; font-size: 14px; font-weight: 700; box-shadow: 0 3px 10px rgba(36, 31, 26, 0.08);">{{f.label}}</span>
          <span style="width: 46px; height: 46px; border-radius: 999px; background: {{f.bg}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 14px rgba(36, 31, 26, 0.16);">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div onClick="{{toggleFab}}" style="position: absolute; right: 18px; bottom: 84px; width: 60px; height: 60px; border-radius: 999px; background: #2F5D4C; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(47, 93, 76, 0.34);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" style="transform: rotate({{fabRot}});"><path d="M12 5v14M5 12h14"/></svg>
  </div>

    <div style="margin-top: auto; display: flex; align-items: stretch; background: #FFFFFF; border-top: 1px solid #E3DCD1; padding: 4px 4px 10px;">
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.2l2.8 2.8L16.4 9.4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">待辦</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9.5 4h5v2.6h-5z"/><path d="M9 12h6M9 16h4"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">壓表</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2F5D4C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span style="font-size: 11px; font-weight: 700; color: #2F5D4C;">日曆</span>
        <span style="width:5px;height:5px;border-radius:999px;background:#2F5D4C;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.7-5.8 6-5.8s6 2.6 6 5.8"/><path d="M16.4 5.4a3.2 3.2 0 010 5.6M20.5 20c0-2.3-.9-4-2.2-5.1"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">客戶</span>
        <span style="width:5px;height:5px;"></span>
      </div>
      <div style="flex-grow: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.8M12 18.6v2.8M2.6 12h2.8M18.6 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">設定</span>
        <span style="width:5px;height:5px;"></span>
      </div>
    </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {}, fab: true };
  }

  renderVals() {
    const st = this.state || {};
    const off = st.off || {};

    const CAL = {
      visit: { label: '來訪', color: '#2F5D4C', soft: '#E4EDE8' },
      personal: { label: '個人行程', color: '#A4703C', soft: '#F5E9DC' },
      leave: { label: '休假', color: '#5B7A8C', soft: '#E6EDF1' },
    };

    const calendars = Object.keys(CAL).map((k) => {
      const on = !off[k];
      return {
        label: CAL[k].label,
        bg: on ? CAL[k].soft : '#FFFFFF',
        line: on ? CAL[k].soft : '#E3DCD1',
        box: on ? CAL[k].color : '#EFE9E0',
        tick: on ? '#FFFFFF' : 'transparent',
        fg: on ? CAL[k].color : '#9A9086',
        toggle: () => this.setState({ off: { ...off, [k]: on } }),
      };
    });

    // 2026 年 8 月 1 日是週六。前後補滿鄰月的日子 —— 留白會讓人以為那幾天沒事。
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'].map((label, i) => ({
      label, fg: i === 0 || i === 6 ? '#A4703C' : '#9A9086',
    }));

    const TODAY = 19;
    const mkDay = (n, dim) => ({
      n: String(n),
      dim,
      weight: n === TODAY && !dim ? '700' : '500',
      fg: dim ? '#C4BBAE' : n === TODAY ? '#FFFFFF' : '#241F1A',
      bg: n === TODAY && !dim ? '#2F5D4C' : 'transparent',
    });

    const rows = [
      [26, 27, 28, 29, 30, 31, 1].map((n, i) => mkDay(n, i < 6)),
      [2, 3, 4, 5, 6, 7, 8].map((n) => mkDay(n, false)),
      [9, 10, 11, 12, 13, 14, 15].map((n) => mkDay(n, false)),
      [16, 17, 18, 19, 20, 21, 22].map((n) => mkDay(n, false)),
      [23, 24, 25, 26, 27, 28, 29].map((n) => mkDay(n, false)),
      [30, 31, 1, 2, 3, 4, 5].map((n, i) => mkDay(n, i >= 2)),
    ];

    // col 為 1–7，span 為橫跨幾格，lane 為第幾條（0 起算）
    const barSpec = [
      [],
      [
        { col: 2, span: 4, lane: 0, cal: 'leave', label: '宜蘭休假' },
        { col: 4, span: 1, lane: 1, cal: 'visit', label: '王小姐 復能' },
        { col: 7, span: 1, lane: 1, cal: 'visit', label: '陳先生 靜脈' },
      ],
      [
        { col: 4, span: 1, lane: 0, cal: 'visit', label: '陳先生 靜脈' },
        { col: 5, span: 1, lane: 0, cal: 'personal', label: '高齡演講' },
        { col: 6, span: 1, lane: 0, cal: 'visit', label: '黃太太 健檢' },
        { col: 2, span: 1, lane: 0, cal: 'visit', label: '林小姐 復能' },
      ],
      [
        { col: 3, span: 1, lane: 0, cal: 'visit', label: '林小姐 復能' },
        { col: 4, span: 1, lane: 0, cal: 'visit', label: '王小姐 二返' },
        { col: 5, span: 2, lane: 1, cal: 'personal', label: '公出 · 兩天' },
        { col: 7, span: 1, lane: 0, cal: 'visit', label: '黃太太 點滴' },
      ],
      [
        { col: 3, span: 1, lane: 0, cal: 'visit', label: '陳先生 EECP' },
        { col: 5, span: 1, lane: 0, cal: 'visit', label: '王小姐 復能' },
        { col: 5, span: 1, lane: 1, cal: 'visit', label: '林小姐 靜脈' },
        { col: 5, span: 1, lane: 2, cal: 'visit', label: '黃太太 復健科' },
      ],
      [
        { col: 2, span: 1, lane: 0, cal: 'visit', label: '王小姐 復能' },
      ],
    ];

    const weeks = rows.map((days, wi) => ({
      days: days.map((d, i) => ({ ...d, col: i + 1 })),
      bars: barSpec[wi]
        .filter((b) => !off[b.cal])
        .map((b) => ({
          col: b.col,
          span: b.span,
          row: b.lane + 2,
          bg: CAL[b.cal].soft,
          fg: CAL[b.cal].color,
          label: b.label,
        })),
      more: wi === 4 ? [{ col: 5, row: 5, label: '+2' }] : [],
    }));

    return {
      weekdays,
      calendars,
      weeks,
      fabOpen: !!st.fab,
      fabRot: st.fab ? '45deg' : '0deg',
      toggleFab: () => this.setState({ fab: !st.fab }),
      fabItems: [
        { label: '新增個人行程', bg: '#A4703C' },
        { label: '新增來訪', bg: '#2F5D4C' },
      ],
    };
  }
}
</script>
</body>
</html>
