<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #f4f2ef; color: #1b1917; font-size: 16px; line-height: 1.55;
      font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif; }
    a { color: #17605d; } a:hover { color: #0f4644; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .sec { font-size: 13px; font-weight: 650; color: #6b655d; letter-spacing: 0.06em; }
    .card { background: #fffdfb; border: 1px solid #e0dad2; border-radius: 12px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; }
    .pick { height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 1px solid #e0dad2; background: #fffdfb; font-size: 15px; font-weight: 600; }
    .pick--on { border: 1.5px solid #17605d; background: #e2eeec; color: #17605d; }
    .pick--off { color: #a53228; background: #f7e4e0; border-color: #f0cec7; text-decoration: line-through; font-weight: 600; }
    .field { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border: 1px solid #e0dad2; border-radius: 10px; background: #fffdfb; font-size: 16px; }
    .nav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b655d; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f4f2ef; overflow: hidden">

  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; background: #fffdfb; border-bottom: 1px solid #e0dad2">
    <span style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17605d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </span>
    <span style="font-size: 19px; font-weight: 700">來訪</span>
    <span style="flex-grow: 1"></span>
    <span style="font-size: 13px; font-weight: 650; padding: 3px 10px; border-radius: 999px; background: #f8eeda; color: #8a5a10">等回覆</span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 10px">

    <div class="card" style="gap: 8px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 22px; font-weight: 700">客戶丁</span>
        <span class="num" style="font-size: 20px; font-weight: 600">9/3</span>
        <span style="font-size: 14px; color: #6b655d">（三）</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 8px; background: #f7e4e0; color: #a53228">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/></svg>
        <span style="font-size: 14px; font-weight: 650; line-height: 1.4">體內金屬 — 超磁場、高能量雷射已停用</span>
      </div>
    </div>

    <!-- 時段 1 -->
    <div class="card">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span class="num" style="font-size: 21px; font-weight: 600">10:30–11:30</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 16px; font-weight: 650">復能</span>
        <span class="num" style="font-size: 14px; color: #6b655d">剩 11 / 12</span>
      </div>

      <div>
        <div class="sec" style="margin-bottom: 6px">器材</div>
        <div style="display: flex; flex-wrap: wrap; gap: 7px">
          <span class="pick pick--on">INDIBA</span>
          <span class="pick pick--off">超磁場</span>
          <span class="pick pick--off">高能量雷射</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr; gap: 8px">
        <div>
          <div class="sec" style="margin-bottom: 6px">治療師</div>
          <div class="field"><span style="flex-grow: 1">騰崴</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b655d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
      <span style="height: 1px; flex-grow: 1; background: #d9d2c9"></span>
      <span class="num" style="font-size: 13px; color: #6b655d">間隔 15 分鐘</span>
      <span style="height: 1px; flex-grow: 1; background: #d9d2c9"></span>
    </div>

    <!-- 時段 2 -->
    <div class="card">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span class="num" style="font-size: 21px; font-weight: 600">11:45–12:45</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 16px; font-weight: 650">靜脈</span>
        <span class="num" style="font-size: 14px; color: #6b655d">剩 17 / 20</span>
      </div>

      <div>
        <div class="sec" style="margin-bottom: 6px">診間</div>
        <div class="field"><span style="flex-grow: 1">治2</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b655d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px; border-radius: 8px; background: #f8eeda; color: #8a5a10">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2h.01"/></svg>
        <span style="font-size: 14px; line-height: 1.45"><b>治2 已被客戶己佔用</b> — 治7、治9 有空。只是提醒，不會擋著不讓你存。</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 10px; border: 1px dashed #c9c1b7; color: #17605d; font-size: 15px; font-weight: 650">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      新增一個時段
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b655d; padding: 0 2px">
      <span>存檔後自動產生</span>
      <span style="font-size: 13px; font-weight: 650; padding: 2px 9px; border-radius: 999px; background: #ece8e2; color: #4a453e">Abovee</span>
      <span>死線 <span class="num">9/2</span></span>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; gap: 10px; padding: 10px 16px; background: #fffdfb; border-top: 1px solid #e0dad2">
    <span style="height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid #c9c1b7; background: #fffdfb; font-size: 16px; font-weight: 650; display: inline-flex; align-items: center">取消</span>
    <span style="flex-grow: 1; height: 48px; border-radius: 10px; background: #17605d; color: #fffdfb; font-size: 16px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center">記錄這次來訪</span>
  </div>

  <div style="flex-shrink: 0; height: 78px; display: flex; background: #fffdfb; border-top: 1px solid #e0dad2; padding-bottom: 16px">
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span style="font-size: 12px">待辦</span></div>
    <div class="nav" style="color: #17605d; position: relative">
      <span style="position: absolute; top: 0; width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: #17605d"></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-4.6 6-4.6s6 1.6 6 4.6"/><path d="M16.5 6.2a3 3 0 0 1 0 5.6"/><path d="M18.2 14.8c1.8.6 2.8 1.9 2.8 4.2"/></svg>
      <span style="font-size: 12px; font-weight: 650">客戶</span>
    </div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2.4"/><path d="M8.5 3v3"/><path d="M15.5 3v3"/><path d="M8.5 11h7"/><path d="M8.5 15.5h4.5"/></svg><span style="font-size: 12px">壓表</span></div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.4"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span style="font-size: 12px">日曆</span></div>
    <div class="nav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 12h4"/><path d="M12 12h8"/><path d="M4 17h9"/><path d="M17 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg><span style="font-size: 12px">設定</span></div>
  </div>
</div>
</x-dc>
