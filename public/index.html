<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d4c" />
    <title>排課系統</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 舊版 iOS Safari 只認得 apple- 前綴那個，兩個都要留 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="排課" />

    <!-- 字體。刻意用 media="print" + onload 換成 all：這樣它永遠不會擋住第一次繪製，
         訊號差或離線時畫面照樣立刻出來，只是先用系統內建的字（見 tokens.css
         的 fallback 堆疊與 ADR-0016）。沒有 JS 的情況下 <noscript> 補一份。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;family=Noto+Serif+TC:wght@500;600;700&amp;display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;family=Noto+Serif+TC:wght@500;600;700&amp;display=swap"
      />
    </noscript>


    <!-- 淺色／深色。**要在第一次繪製之前蓋上去**，晚一步就會閃一下白的，
         所以它是行內的、不是 module（module 是 defer 的，來不及）。
         同一件事的執行期版本在 /js/ui/theme.js —— key 與那三個值兩邊要一致，
         `tests/tokens.test.js` 盯著。 -->
    <script>
      (function () {
        var choice = 'system';
        try {
          var saved = localStorage.getItem('scheduler.theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') choice = saved;
        } catch (e) { /* 無痕視窗讀不到，當作跟著系統 */ }
        var dark = choice === 'dark'
          || (choice === 'system'
              && window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', dark ? '#1a1714' : '#2f5d4c');
      })();
    </script>

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="root" class="app">
      <div class="gate">
        <p class="muted">載入中…</p>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script>
      // app.js 是 module，它的 import 一旦失敗（訊號差、CDN 連不上、
      // 檔案沒部署完整），整支就不會執行，畫面會永遠停在「載入中…」。
      // 沈默失敗違反 SPEC 第 6.9 節，所以這裡用逾時把它變成看得見的訊息。
      // 這段刻意寫成不用 module、不依賴任何其他檔案，它必須在最壞情況下還能跑。
      setTimeout(function () {
        if (window.__appBooted) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div class="gate"><div class="card gate__box">' +
          '<h2 class="card__title">載入失敗</h2>' +
          '<p class="muted">程式檔案沒有下載完成，通常是網路不穩。' +
          '資料都在雲端，沒有任何東西會因此遺失。</p>' +
          '<p><button class="btn btn--primary" type="button" ' +
          'onclick="location.reload()">重新載入</button></p>' +
          '</div></div>';
      }, 12000);
    </script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
