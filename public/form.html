<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d4c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>不方便的時間</title>

    <!-- 這一頁是給客戶填的，不是 app 的一部分（ADR-0031）：
         沒有 manifest、不註冊 service worker、不載 app.js。
         客戶只是在 LINE 裡點開一個連結，他不該下載一整個排班系統。 -->

    <!-- LINE 貼上連結時會抓這幾個標籤來畫預覽卡。沒有它們的話，LINE 會自己
         從內文撈一段 —— 第一版就是這樣，預覽卡上寫著「載入中…」，
         看起來像壞掉的網頁，而客戶要不要點下去就是看這張卡。
         LINE 的預覽是按網址快取的，但每一條連結的 token 都不一樣，
         所以改完之後新發的連結就會是新的預覽。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="不方便的時間" />
    <meta
      property="og:description"
      content="點一下這個月不方便的日期就好，大概半分鐘。"
    />
    <meta name="description" content="點一下這個月不方便的日期就好，大概半分鐘。" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap"
    />

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/form.css" />
  </head>
  <body>
    <!-- 這一行在 JS 接手之前只會出現一瞬間，但它同時是 LINE 預覽卡與
         沒有 JS 的爬蟲看到的內容，所以寫的是「這一頁要做什麼」，
         不是「載入中」—— 一個看起來像壞掉的字會讓客戶直接關掉。 -->
    <main id="root" class="wrap">
      <p class="wait">點一下這個月不方便的日期就好，大概半分鐘。</p>
    </main>

    <script>
      // 跟 index.html 同一道保險絲：module 的 import 失敗（訊號差、檔案沒部署完整）
      // 整支就不會執行，畫面會永遠停在「載入中…」。客戶不會重新整理，
      // 他會關掉然後這一輪就沒填 —— 所以沈默失敗在這一頁比在 app 裡更貴。
      setTimeout(function () {
        if (window.__formBooted) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div class="card card--talk"><p class="talk">頁面沒有載入完成，' +
          '通常是網路不穩。</p><p><button class="go" type="button" ' +
          'onclick="location.reload()">再試一次</button></p></div>';
      }, 12000);
    </script>
    <script type="module" src="/js/form/page.js"></script>
  </body>
</html>
