<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d4c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>方便的時間</title>

    <!-- 這一頁是給客戶填的，不是 app 的一部分（ADR-0031）：
         沒有 manifest、不註冊 service worker、不載 app.js。
         客戶只是在 LINE 裡點開一個連結，他不該下載一整個排班系統。 -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap"
    />

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/form.css" />
  </head>
  <body>
    <main id="root" class="wrap">
      <p class="wait">載入中…</p>
    </main>

    <script>
      // 跟 index.html 同一道保險絲：module 的 import 失敗（訊號差、檔案沒部署完整）
      // 整支就不會執行，畫面會永遠停在「載入中…」。客戶不會重新整理，
      // 他會關掉然後這一輪就沒填 —— 所以沈默失敗在這一頁比在 app 裡更貴。
      setTimeout(function () {
        if (window.__formBooted) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div class="card card--talk"><p class="talk">頁面沒有載入完成，' +
          '通常是網路不穩。</p><p><button class="go" type="button" ' +
          'onclick="location.reload()">再試一次</button></p></div>';
      }, 12000);
    </script>
    <script type="module" src="/js/form/page.js"></script>
  </body>
</html>
